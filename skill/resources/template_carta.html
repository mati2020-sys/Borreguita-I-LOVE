<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>💌 {{TITULO}}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px;
      background: linear-gradient(160deg, #ffe4f0 0%, #fff4d6 50%, #dff1ff 100%);
      font-family: 'Caveat', cursive; color: #7a4a3a;
    }
    body::before {
      content: ''; position: fixed; inset: 0;
      background-image: radial-gradient(rgba(255, 255, 255, 0.8) 2px, transparent 2.5px);
      background-size: 26px 26px; pointer-events: none;
    }
    .sheet {
      position: relative; width: min(560px, 100%);
      padding: 34px 30px 30px 62px; border-radius: 20px;
      background:
        repeating-linear-gradient(180deg, transparent 0, transparent 37px, #ffd0e2 37px, #ffd0e2 39px),
        #fffdf8;
      box-shadow: 0 18px 40px rgba(122, 74, 58, 0.2), 0 0 0 5px #fff, 0 0 0 9px #ffb8d4;
    }
    .sheet::before {
      content: '♡ ♡ ♡ ♡ ♡ ♡'; position: absolute; left: 20px; top: 40px; bottom: 30px;
      width: 20px; color: #ff7fae; font-size: 20px; line-height: 2.4;
      word-wrap: break-word; border-right: 2px solid #ffb3cf;
    }
    .deco { text-align: center; font-size: 26px; letter-spacing: 10px; margin-bottom: 8px; }
    h1 {
      font-family: 'Fredoka', sans-serif; color: #ff7fae; font-size: 34px; line-height: 1.2;
      margin-bottom: 12px; text-shadow: 2px 2px 0 #fff;
    }
    .text {
      font-size: 27px; line-height: 39px; white-space: pre-wrap; word-wrap: break-word;
      min-height: 140px;
    }
    .foot {
      margin-top: 26px; text-align: right; font-size: 24px; font-weight: 700; color: #ff7fae;
    }
    .date {
      font-family: sans-serif; font-size: 12px; opacity: 0.6; text-align: right; margin-top: 6px;
    }
  </style>
</head>
<body>
  <div class="sheet">
    <div class="deco">🌸 🐑 🎀</div>
    <h1>{{TITULO}}</h1>
    <div class="text">{{CONTENIDO}}</div>
    <div class="foot">Con amor, {{FIRMA}} 💖</div>
    <div class="date">{{FECHA}}</div>
  </div>
</body>
</html>
